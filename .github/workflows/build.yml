name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-unsigned-ipa:
    name: Build Locus unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Fetch Git LFS files
        shell: bash
        run: |
          touch build.log
          git lfs pull || true
      - name: Ensure libidevice_ffi.a is present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Vendor/idevice
          
          # Check if already present and is a valid binary archive (> 1MB)
          if [ -f "Vendor/idevice/libidevice_ffi.a" ]; then
            FILE_SIZE=$(wc -c < "Vendor/idevice/libidevice_ffi.a" | tr -d ' ')
            if [ "$FILE_SIZE" -gt 1000000 ]; then
              echo "libidevice_ffi.a is already present and valid (${FILE_SIZE} bytes)."
              exit 0
            fi
          fi

          echo "Downloading precompiled libidevice_ffi.a..."
          CURRENT_REPO="${{ github.repository }}"
          CURRENT_REF="${{ github.ref_name }}"
          curl -sSL -f "https://raw.githubusercontent.com/${CURRENT_REPO}/${CURRENT_REF}/Vendor/idevice/libidevice_ffi.a" -o Vendor/idevice/libidevice_ffi.a || \
          curl -sSL -f "https://raw.githubusercontent.com/ChrisMack32/Locus/main/Vendor/idevice/libidevice_ffi.a" -o Vendor/idevice/libidevice_ffi.a || \
          curl -sSL -f "https://github.com/ChrisMack32/Locus/raw/main/Vendor/idevice/libidevice_ffi.a" -o Vendor/idevice/libidevice_ffi.a

          test -f "Vendor/idevice/libidevice_ffi.a"
          FILE_SIZE=$(wc -c < "Vendor/idevice/libidevice_ffi.a" | tr -d ' ')
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::libidevice_ffi.a is invalid or a pointer file (${FILE_SIZE} bytes)."
            exit 1
          fi
          echo "Successfully verified libidevice_ffi.a (${FILE_SIZE} bytes)."
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -1 /Applications | grep -E '^Xcode.*\.app$' || true
          
          SELECTED=""
          for xcode_path in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              SELECTED="$xcode_path"
              break
            fi
          done
          
          if [ -n "$SELECTED" ]; then
            sudo xcode-select -s "$SELECTED"
          fi
          
          echo "Selected Xcode:"
          xcodebuild -version
          echo
          echo "iPhoneOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Locus.xcodeproj
          xcodegen generate --spec project.yml
          test -d Locus.xcodeproj
      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Schemes:"
          xcodebuild \
            -project Locus.xcodeproj \
            -list
          echo
          echo "Project deployment target:"
          grep -n 'deploymentTarget\|IPHONEOS_DEPLOYMENT_TARGET\|xcodeVersion' project.yml || true
      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log || STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "::group::❌ Compilation Errors & Diagnostics"
            echo "=========================================="
            echo "       BUILD FAILED - ERROR SUMMARY       "
            echo "=========================================="
            grep -E 'error: ' build.log | while IFS= read -r line; do
              echo "$line"
              if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
                FILE="${BASH_REMATCH[1]}"
                LINE="${BASH_REMATCH[2]}"
                COL="${BASH_REMATCH[3]}"
                MSG="${BASH_REMATCH[4]}"
                echo "::error file=$FILE,line=$LINE,col=$COL::$MSG"
              fi
            done
            echo "=========================================="
            echo "Last 60 lines of build.log:"
            tail -n 60 build.log
            echo "::endgroup::"
            exit "$STATUS"
          fi

          # Optionally compile and embed LocusWidgets extension for Lock Screen / Dynamic Island Live Activities
          echo "Attempting optional LocusWidgets extension build..."
          if xcodebuild \
            -project Locus.xcodeproj \
            -target LocusWidgets \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build >> build.log 2>&1; then
            APPEX="build/Build/Products/Release-iphoneos/LocusWidgets.appex"
            APP="build/Build/Products/Release-iphoneos/Locus.app"
            if [ -d "$APPEX" ] && [ -d "$APP" ]; then
              mkdir -p "$APP/PlugIns"
              cp -R "$APPEX" "$APP/PlugIns/LocusWidgets.appex"
              codesign --remove-signature "$APP/PlugIns/LocusWidgets.appex" 2>/dev/null || true
              echo "Successfully embedded LocusWidgets.appex into Locus.app/PlugIns."
            fi
          else
            echo "Notice: Skipping optional LocusWidgets.appex embedding; standalone Locus.app built cleanly."
          fi
      - name: Locate built app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Locus.app was not produced."
            echo
            echo "Release products:"
            find build/Build/Products -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "Found:"
          du -sh "$APP"
          echo "$APP"
      - name: Verify app is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          echo "Checking code signature..."
          if codesign -dvv "$APP" 2>&1 | grep -q "Authority="; then
            echo "::error::The application is signed."
            codesign -dvv "$APP" 2>&1 || true
            exit 1
          fi
          echo "No signing authority found."
      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Locus.app
          rm -f LocusPlus-unsigned.ipa
          /usr/bin/zip \
            -qry \
            LocusPlus-unsigned.ipa \
            Payload
          test -f LocusPlus-unsigned.ipa
          echo "IPA created:"
          ls -lh LocusPlus-unsigned.ipa
      - name: Verify IPA contents
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/unzip -t LocusPlus-unsigned.ipa
          echo
          echo "IPA contents:"
          /usr/bin/unzip -l LocusPlus-unsigned.ipa | head -50
          echo
          echo "IPA verification passed."
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned-IPA
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
