name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build Locus unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          lfs: false
          submodules: recursive

      - name: Fetch Git LFS files
        shell: bash
        run: |
          touch build.log
          git lfs pull || true

      - name: Ensure libidevice_ffi.a is present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Vendor/idevice
          
          # Check if already present and is a valid binary archive (> 10MB, actual is ~91MB)
          if [ -f "Vendor/idevice/libidevice_ffi.a" ]; then
            FILE_SIZE=$(wc -c < "Vendor/idevice/libidevice_ffi.a" | tr -d ' ')
            if [ "$FILE_SIZE" -gt 10000000 ]; then
              echo "libidevice_ffi.a is already present and valid (${FILE_SIZE} bytes)."
              exit 0
            fi
            echo "libidevice_ffi.a is only ${FILE_SIZE} bytes (likely a pointer or truncated file); re-downloading..."
            rm -f "Vendor/idevice/libidevice_ffi.a"
          fi

          echo "Downloading precompiled libidevice_ffi.a..."
          CURRENT_REPO="${{ github.repository }}"
          CURRENT_REF="${{ github.ref_name }}"
          
          DOWNLOADED=0
          URLS=(
            "https://raw.githubusercontent.com/ChrisMack32/Locus/main/Vendor/idevice/libidevice_ffi.a"
            "https://github.com/ChrisMack32/Locus/raw/main/Vendor/idevice/libidevice_ffi.a"
            "https://raw.githubusercontent.com/${CURRENT_REPO}/${CURRENT_REF}/Vendor/idevice/libidevice_ffi.a"
            "https://raw.githubusercontent.com/${CURRENT_REPO}/main/Vendor/idevice/libidevice_ffi.a"
            "https://github.com/${CURRENT_REPO}/raw/main/Vendor/idevice/libidevice_ffi.a"
          )
          
          for url in "${URLS[@]}"; do
            echo "Trying URL: $url"
            if curl -sSL -f --retry 3 --retry-delay 2 --connect-timeout 20 "$url" -o Vendor/idevice/libidevice_ffi.a; then
              FILE_SIZE=$(wc -c < "Vendor/idevice/libidevice_ffi.a" | tr -d ' ')
              if [ "$FILE_SIZE" -gt 10000000 ]; then
                echo "Successfully downloaded libidevice_ffi.a (${FILE_SIZE} bytes)."
                DOWNLOADED=1
                break
              fi
            fi
            rm -f "Vendor/idevice/libidevice_ffi.a"
          done
          
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Failed to obtain valid libidevice_ffi.a binary."
            exit 1
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -1 /Applications | grep -E '^Xcode.*\.app$' || true
          
          SELECTED=""
          for xcode_path in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r); do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              SELECTED="$xcode_path"
              break
            fi
          done
          
          if [ -z "$SELECTED" ]; then
            for xcode_path in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
              if [ -d "$xcode_path/Contents/Developer" ]; then
                SELECTED="$xcode_path"
                break
              fi
            done
          fi
          
          if [ -n "$SELECTED" ]; then
            echo "Switching to $SELECTED"
            sudo xcode-select -s "$SELECTED"
            echo "DEVELOPER_DIR=$SELECTED/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$SELECTED/Contents/Developer"
          fi
          
          echo "Selected Xcode:"
          xcodebuild -version
          echo
          echo "iPhoneOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Locus.xcodeproj
          xcodegen generate --spec project.yml
          test -d Locus.xcodeproj

      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Schemes:"
          xcodebuild -project Locus.xcodeproj -list
          echo
          echo "Project deployment target:"
          grep -n 'deploymentTarget\|IPHONEOS_DEPLOYMENT_TARGET\|xcodeVersion' project.yml || true

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          CONFIG="${{ inputs.configuration || 'Release' }}"
          echo "Building Locus configuration: $CONFIG"
          
          build_archive() {
            echo "--- Executing xcodebuild archive with ad-hoc signing ('-') ---"
            rm -rf "$PWD/build/Locus.xcarchive"
            local STATUS=0
            xcodebuild \
              -project Locus.xcodeproj \
              -scheme Locus \
              -configuration "$CONFIG" \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/Locus.xcarchive" \
              SKIP_INSTALL=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY="-" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGN_ENTITLEMENTS="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              archive 2>&1 | tee -a build.log || STATUS=${PIPESTATUS[0]}

            if [ "$STATUS" -eq 0 ] && [ -d "$PWD/build/Locus.xcarchive/Products/Applications/Locus.app" ]; then
              echo "Archive succeeded: found Locus.app at $PWD/build/Locus.xcarchive/Products/Applications/Locus.app"
              return 0
            fi
            echo "Archive did not produce Locus.app (exit code $STATUS)."
            return 1
          }

          build_direct() {
            echo "--- Executing direct xcodebuild build to DerivedData ---"
            local STATUS=0
            xcodebuild \
              -project Locus.xcodeproj \
              -scheme Locus \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build/DerivedData" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY="-" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGN_ENTITLEMENTS="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build 2>&1 | tee -a build.log || STATUS=${PIPESTATUS[0]}

            local APP_FOUND
            APP_FOUND=$(find "$PWD/build" -name "Locus.app" -type d 2>/dev/null | head -n 1)
            if [ -n "$APP_FOUND" ] && [ -d "$APP_FOUND" ]; then
              echo "Direct build succeeded: found Locus.app at $APP_FOUND"
              return 0
            fi
            echo "Direct build did not produce Locus.app (exit code $STATUS)."
            return 1
          }

          # Attempt 1: Standard Archive with ad-hoc signing
          BUILD_SUCCESS=0
          if build_archive; then
            BUILD_SUCCESS=1
          elif build_direct; then
            BUILD_SUCCESS=1
          fi

          # Attempt 2: If build failed and LocusWidgets is present, strip extension and retry standalone
          if [ "$BUILD_SUCCESS" -ne 1 ] && grep -q "LocusWidgets:" project.yml 2>/dev/null; then
            echo "Notice: Retrying with standalone Locus app without widget extension..."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("project.yml", "utf8");
              const lines = content.split("\n");
              const filtered = [];
              let skipping = false;
              for (const line of lines) {
                if (/^  LocusWidgets:/.test(line)) {
                  skipping = true;
                  continue;
                }
                if (skipping && /^[a-zA-Z0-9_]/.test(line)) {
                  skipping = false;
                } else if (skipping && /^  [a-zA-Z0-9_]/.test(line)) {
                  skipping = false;
                }
                if (!skipping) {
                  filtered.push(line);
                }
              }
              fs.writeFileSync("project.yml", filtered.join("\n"));
            '
            rm -rf Locus.xcodeproj build/DerivedData build/Locus.xcarchive
            xcodegen generate --spec project.yml
            
            if build_archive; then
              BUILD_SUCCESS=1
            elif build_direct; then
              BUILD_SUCCESS=1
            fi
          fi

          if [ "$BUILD_SUCCESS" -ne 1 ]; then
            echo "::group::❌ Compilation Errors & Diagnostics"
            echo "=========================================="
            echo "       BUILD FAILED - ERROR SUMMARY       "
            echo "=========================================="
            grep -E 'error: ' build.log | while IFS= read -r line; do
              echo "$line"
              if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
                FILE="${BASH_REMATCH[1]}"
                LINE="${BASH_REMATCH[2]}"
                COL="${BASH_REMATCH[3]}"
                MSG="${BASH_REMATCH[4]}"
                echo "::error file=$FILE,line=$LINE,col=$COL::$MSG"
              fi
            done
            echo "=========================================="
            echo "Last 80 lines of build.log:"
            tail -n 80 build.log
            echo "::endgroup::"
            exit 1
          fi

          # Optional: compile and embed LocusWidgets extension if present in project and standalone app succeeded
          if grep -q "LocusWidgets:" project.yml 2>/dev/null; then
            echo "Attempting optional LocusWidgets extension build..."
            if xcodebuild \
              -project Locus.xcodeproj \
              -target LocusWidgets \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build/DerivedData" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY="-" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGN_ENTITLEMENTS="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build >> build.log 2>&1; then
              APPEX=$(find "$PWD/build" -name "LocusWidgets.appex" -type d 2>/dev/null | head -n 1)
              APP=$(find "$PWD/build" -name "Locus.app" -type d 2>/dev/null | head -n 1)
              if [ -n "$APPEX" ] && [ -n "$APP" ]; then
                mkdir -p "$APP/PlugIns"
                cp -R "$APPEX" "$APP/PlugIns/LocusWidgets.appex"
                codesign --remove-signature "$APP/PlugIns/LocusWidgets.appex" 2>/dev/null || true
                echo "Successfully embedded LocusWidgets.appex into Locus.app/PlugIns."
              fi
            else
              echo "Notice: Skipping optional LocusWidgets.appex embedding; standalone Locus.app built cleanly."
            fi
          fi

      - name: Locate built app
        shell: bash
        run: |
          set -euo pipefail
          APP=""
          
          CANDIDATES=(
            "$PWD/build/Locus.xcarchive/Products/Applications/Locus.app"
            "$PWD/build/Products/Locus.app"
            "$PWD/build/Products/${CONFIG:-Release}-iphoneos/Locus.app"
            "$PWD/build/DerivedData/Build/Products/${CONFIG:-Release}-iphoneos/Locus.app"
            "$PWD/build/Build/Products/${CONFIG:-Release}-iphoneos/Locus.app"
            "$PWD/build/DerivedData/Build/Products/Release-iphoneos/Locus.app"
            "$PWD/build/Build/Products/Release-iphoneos/Locus.app"
          )
          for candidate in "${CANDIDATES[@]}"; do
            if [ -d "$candidate" ]; then
              APP="$candidate"
              echo "Discovered app at candidate path: $APP"
              break
            fi
          done

          if [ -z "$APP" ]; then
            APP=$(find "$PWD/build" -name "Locus.app" -type d 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP" ]; then
            APP=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "Locus.app" -type d 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP" ]; then
            APP=$(find "$PWD" -name "*.app" -type d -not -path "*/.*" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::Locus.app was not produced."
            echo
            echo "Contents of build directory:"
            find "$PWD/build" -maxdepth 5 2>/dev/null || true
            exit 1
          fi

          # Prepare clean staging app directory
          mkdir -p "$PWD/build/StagedApp"
          rm -rf "$PWD/build/StagedApp/Locus.app"
          cp -R "$APP" "$PWD/build/StagedApp/Locus.app"
          STAGED="$PWD/build/StagedApp/Locus.app"

          # Cleanly remove any residual or ad-hoc signatures for sideloading
          codesign --remove-signature "$STAGED" 2>/dev/null || true
          if [ -d "$STAGED/PlugIns/LocusWidgets.appex" ]; then
            codesign --remove-signature "$STAGED/PlugIns/LocusWidgets.appex" 2>/dev/null || true
          fi

          echo "APP_PATH=$STAGED" >> "$GITHUB_ENV"
          echo "Found app bundle at: $STAGED"
          du -sh "$STAGED"

      - name: Verify app is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APP="${APP_PATH}"
          echo "Checking code signature for $APP..."
          SIG_INFO=$(codesign -dvv "$APP" 2>&1 || true)
          echo "$SIG_INFO"
          if echo "$SIG_INFO" | grep -q "Authority="; then
            echo "::error::The application is signed with an authority."
            exit 1
          fi
          echo "Verified: No signing authority found (ready for sideloading)."

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="${APP_PATH}"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Locus.app
          rm -f LocusPlus-unsigned.ipa Locus-unsigned.ipa
          /usr/bin/zip -qry LocusPlus-unsigned.ipa Payload
          cp LocusPlus-unsigned.ipa Locus-unsigned.ipa
          test -f LocusPlus-unsigned.ipa
          echo "IPA created successfully:"
          ls -lh LocusPlus-unsigned.ipa Locus-unsigned.ipa

      - name: Verify IPA contents
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/unzip -t LocusPlus-unsigned.ipa
          echo
          echo "IPA contents summary:"
          /usr/bin/unzip -l LocusPlus-unsigned.ipa | head -n 50
          echo
          echo "IPA verification passed."

      - name: Upload unsigned IPA (LocusPlus-unsigned)
        uses: actions/upload-artifact@v4.6.1
        with:
          name: LocusPlus-unsigned
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned IPA (Locus-unsigned)
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Locus-unsigned
          path: Locus-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
