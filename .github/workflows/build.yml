name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build Locus unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 1

      - name: Cache libidevice_ffi.a
        id: cache-idevice
        uses: actions/cache@v4.2.2
        with:
          path: Vendor/idevice/libidevice_ffi.a
          key: libidevice-ffi-v1-${{ hashFiles('Vendor/idevice/idevice.h') }}
          restore-keys: |
            libidevice-ffi-v1-

      - name: Ensure libidevice_ffi.a is present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Vendor/idevice
          IDEVICE_A="Vendor/idevice/libidevice_ffi.a"
          
          if [ -f "$IDEVICE_A" ]; then
            FILE_SIZE=$(wc -c < "$IDEVICE_A" | tr -d ' ')
            if [ "$FILE_SIZE" -gt 10000000 ]; then
              echo "libidevice_ffi.a is cached and valid (${FILE_SIZE} bytes)."
              exit 0
            fi
            echo "libidevice_ffi.a is only ${FILE_SIZE} bytes (likely a pointer or truncated file); re-downloading..."
            rm -f "$IDEVICE_A"
          fi

          echo "Downloading precompiled libidevice_ffi.a..."
          DOWNLOADED=0
          URLS=(
            "https://raw.githubusercontent.com/ChrisMack32/Locus/main/Vendor/idevice/libidevice_ffi.a"
            "https://github.com/ChrisMack32/Locus/raw/main/Vendor/idevice/libidevice_ffi.a"
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Vendor/idevice/libidevice_ffi.a"
          )
          
          for url in "${URLS[@]}"; do
            echo "Trying URL: $url"
            if curl -sSL -f --retry 3 --retry-delay 2 --connect-timeout 20 "$url" -o "$IDEVICE_A"; then
              FILE_SIZE=$(wc -c < "$IDEVICE_A" | tr -d ' ')
              if [ "$FILE_SIZE" -gt 10000000 ]; then
                echo "Successfully downloaded libidevice_ffi.a (${FILE_SIZE} bytes)."
                DOWNLOADED=1
                break
              fi
            fi
            rm -f "$IDEVICE_A"
          done
          
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Failed to obtain valid libidevice_ffi.a binary."
            exit 1
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          SELECTED=""
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode*.app; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              SELECTED="$xcode_path"
              break
            fi
          done
          
          if [ -n "$SELECTED" ]; then
            echo "Switching to $SELECTED"
            sudo xcode-select -s "$SELECTED"
            echo "DEVELOPER_DIR=$SELECTED/Contents/Developer" >> "$GITHUB_ENV"
          fi
          
          echo "Selected Xcode:"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Fast Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Installing precompiled XcodeGen..."
            mkdir -p /tmp/xcodegen_dl
            if curl -sSL -f --connect-timeout 15 --retry 2 "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip" -o /tmp/xcodegen_dl/xcodegen.zip; then
              unzip -qo /tmp/xcodegen_dl/xcodegen.zip -d /tmp/xcodegen_dl
              sudo cp /tmp/xcodegen_dl/xcodegen/bin/xcodegen /usr/local/bin/ || true
              rm -rf /tmp/xcodegen_dl
            fi
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Fallback to brew install..."
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen version

      - name: Build and Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_ipa.sh
          bash scripts/build_ipa.sh "${{ inputs.configuration || 'Release' }}"

      - name: Verify IPA contents and Mach-O executable
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Testing IPA archive integrity ==="
          /usr/bin/unzip -t LocusPlus-unsigned.ipa
          
          echo "=== Inspecting IPA Contents ==="
          /usr/bin/unzip -l LocusPlus-unsigned.ipa | grep -E 'Payload/Locus\.app/(Info\.plist|Locus$|PkgInfo)' || true
          
          # Strictly verify that the main executable binary is packaged inside the IPA
          if ! /usr/bin/unzip -l LocusPlus-unsigned.ipa | grep -q "Payload/Locus.app/Locus"; then
            echo "::error::Critical packaging failure: main executable binary Payload/Locus.app/Locus was NOT found in the IPA!"
            exit 1
          fi
          
          echo "Verified: Main app binary and resources are properly packaged in the IPA."

      - name: Upload unsigned IPA (LocusPlus-unsigned)
        uses: actions/upload-artifact@v4.6.1
        with:
          name: LocusPlus-unsigned
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
