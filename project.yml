name: Locus
options:
  bundleIdPrefix: com.chrismack
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: NO
    SWIFT_COMPILATION_MODE: "wholemodule"
targets:
  Locus:
    type: application
    platform: iOS
    sources:
      - path: Locus
        excludes:
          - "**/Info.plist"
      - path: AppIcon.icon
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismack.locus
        PRODUCT_NAME: Locus
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Locus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Locus/Resources/Locus.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
        SWIFT_COMPILATION_MODE: "wholemodule"

  LocusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LocusWidgets
        excludes:
          - "**/Info.plist"
      - path: Locus/Engine/LocusRouteActivityAttributes.swift
      - path: Locus/Features/Routes/LocusLiveActivityWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismack.locus.widgets
        PRODUCT_NAME: LocusWidgets
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: LocusWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_COMPILATION_MODE: "wholemodule"

  LocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocusTests
        excludes:
          - "**/Info.plist"
      - path: Locus/Engine/RouteBuilder.swift
      - path: Locus/Engine/RouteSimulationEngine.swift
      - path: Locus/Engine/TravelMode.swift
      - path: Locus/Support/SavedRoute.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismack.locus.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_COMPILATION_MODE: "wholemodule"
