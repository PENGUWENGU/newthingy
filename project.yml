name: Locus
options:
  bundleIdPrefix: com.chrismack
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  # Icon Composer packages must be treated as a single file, not exploded.
  fileTypes:
    icon:
      file: true
settings:
  base:
    # Set your Apple Developer Team ID to build from source (see README).
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Locus:
    type: application
    platform: iOS
    sources:
      - path: Locus
        excludes:
          - "**/Info.plist"
      - path: AppIcon.icon
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismack.locus
        PRODUCT_NAME: Locus
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Locus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Locus/Resources/Locus.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
  # Pure-logic unit tests for the GPX codec and custom-speed validation. Deliberately has
  # no `dependencies:` on the Locus target: Locus links Vendor/idevice/libidevice_ffi.a,
  # which is a device-only (arm64) static library with no iOS Simulator slice, so a test
  # bundle hosted by/linked against Locus could never run on a GitHub Actions runner
  # (no physical iPhone attached). Compiling the same source files directly into this
  # standalone bundle instead keeps the tests fully independent of that library, so they
  # run for real on the iOS Simulator both locally and in CI.
  LocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocusTests
      - path: Locus/Engine/RouteBuilder.swift
      - path: Locus/Engine/TravelMode.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismack.locus.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
